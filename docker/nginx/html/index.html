<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraOps Automation Lab - Node Landing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .badge {
            background: #10b981;
            color: #fff;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        h1 { margin-top: 1rem; font-size: 1.8rem; }
        p { color: #94a3b8; line-height: 1.6; margin: 1rem 0 1.5rem; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-outline {
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">ONLINE &bull; DOCKER STACK ACTIVE</span>
        <h1>InfraOps Automation Lab</h1>
        <p>Este nodo ha sido configurado y desplegado de forma 100% automatizada mediante Ansible y Docker Compose. Incluye verificaciones de salud, monitoreo continuo y políticas de seguridad.</p>
        <div class="links">
            <a href="/healthz" class="btn">Probar /healthz</a>
            <a href="http://localhost:3001" class="btn btn-outline" target="_blank">Uptime Kuma</a>
        </div>
    </div>
</body>
</html>
