# ==============================================================================
# InfraOps Automation Lab - Ansible Inventory
# ==============================================================================

# Local controller node (for running local-only plays or testing)
[control]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Primary production or home-lab Ubuntu servers
[managed_nodes]
# primary-server ansible_host=192.168.1.100 ansible_user=sysadmin ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Sandbox test nodes (Docker-based simulated lab nodes)
[sandbox]
lab-node-01 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=sysadmin ansible_ssh_pass=SysAdminLab2026!
lab-node-02 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=sysadmin ansible_ssh_pass=SysAdminLab2026!

# Logical role groupings
[web_servers]
# primary-server
lab-node-01

[monitoring_hosts]
# primary-server
lab-node-02

# Composite group including all target nodes
[lab_fleet:children]
sandbox
managed_nodes
